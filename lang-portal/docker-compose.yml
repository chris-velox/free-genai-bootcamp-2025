version: '3.8'

services:
  backend:
    build: 
      context: .
      dockerfile: backend-flask/Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./backend-flask/instance:/app/instance
    environment:
      - FLASK_ENV=development
      - PYTHONUNBUFFERED=1

  frontend:
    build: 
      context: ./frontend-react
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:5000 